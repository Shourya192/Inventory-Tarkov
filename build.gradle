buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'com.tarkovinventory'
archivesBaseName = 'tarkov-inventory'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                tarkovinventory {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                tarkovinventory {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    // Curios API
    maven { url = "https://maven.theillusivec4.top/" }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // Curios API — optional at runtime, required at compile time for the compat class
    // Use compileOnly so the mod still works without Curios installed
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:1.20.1-5.3.5+:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:1.20.1-5.3.5+")
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "tarkovinventory",
            "Specification-Vendor"    : "tarkovinventory",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "tarkovinventory",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
